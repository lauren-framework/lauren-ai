[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "lauren-ai"
dynamic = ["version"]
description = "First-party AI/LLM companion to the Lauren web framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Lauren Contributors" }]
keywords = ["llm", "ai", "agents", "framework", "lauren"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "lauren",
    "httpx>=0.27",
    "anyio>=4.0",
    "pydantic>=2.7",
    "typing-extensions>=4.11",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.35"]
openai    = ["openai>=1.35"]
ollama    = []                              # pure httpx, no extra dep
litellm   = ["litellm>=1.40"]
pgvector  = ["asyncpg>=0.29", "pgvector>=0.3"]
chroma    = ["chromadb>=0.5"]
qdrant    = ["qdrant-client>=1.9"]
redis     = ["redis[hiredis]>=5.0"]
pypdf     = ["pypdf>=4.0"]
mcp       = ["lauren-mcp"]
all       = [
    "lauren-ai[anthropic,openai,litellm,pgvector,chroma,qdrant,redis,pypdf,mcp]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "anyio[trio]>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "nox>=2024.4",
    "prek>=0.1",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
    "mkdocstrings[python]>=0.27",
    "griffe>=1.0",
    "hatchling>=1.21",
    "hatch-vcs>=0.4",
    "twine>=5.0",
    "lauren-mcp",
]

[project.urls]
Homepage      = "https://github.com/lauren-framework/lauren-ai"
Repository    = "https://github.com/lauren-framework/lauren-ai"
Documentation = "https://ai.lauren-py.dev"
Changelog     = "https://github.com/lauren-framework/lauren-ai/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unknown"

[tool.hatch.build.targets.wheel]
packages = ["src/lauren_ai"]
artifacts = ["src/lauren_ai/py.typed"]

[tool.hatch.build.targets.sdist]
# Only include what a downstream user or contributor needs
include = [
    "src/",
    "tests/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "llms-full.txt",
    "llms.txt",
    "pyproject.toml",
]
exclude = [
    "prds/",
    "skills/",
    ".github/",
    "AGENTS.md",
    "CLAUDE.md",
    "MANIFEST.in",
    ".ruff_cache/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".nox/",
    "dist/",
    "build/",
    "htmlcov/",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "tests",
    "examples",
    "docs",
    "scripts",
    ".nox",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",   # Any annotations are fine in generic helpers
    "B008",     # function calls in default args (common in DI)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"noxfile.py" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = false
disallow_any_generics = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not benchmark and not eval'"
markers = [
    "benchmark: marks tests as benchmarks (excluded from default run)",
    "eval: marks evaluation tests (excluded from default run; may require API keys)",
    "integration: marks integration tests that require external services",
]
testpaths = ["tests"]
pythonpath = ["src", "../lauren-framework"]

[tool.coverage.run]
source = ["src/lauren_ai"]
omit = [
    "tests/*",
    # Provider implementations require live API credentials
    "src/lauren_ai/_transport/_anthropic.py",
    "src/lauren_ai/_transport/_openai.py",
    "src/lauren_ai/_transport/_ollama.py",
    # Skills require external services (web search, HTTP)
    "src/lauren_ai/_skills/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.uv.sources]
lauren-mcp = { path = "../lauren-mcp" }

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "lauren-mcp",
    "nox>=2026.4.10",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
